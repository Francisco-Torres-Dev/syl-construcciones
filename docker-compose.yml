# Levanta PostgreSQL + API + Web. Configura primero las variables del archivo .env.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sl_construcciones}
      POSTGRES_USER: ${POSTGRES_USER:-sl_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sl_app} -d ${POSTGRES_DB:-sl_construcciones}"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sl_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-sl_construcciones}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-sl_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-sl_construcciones}?schema=public
      NODE_ENV: development
      PORT: "4000"
      CLIENT_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      TRUST_PROXY: "true"
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    volumes: [uploads:/data/uploads]

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  dbdata:
  uploads:
